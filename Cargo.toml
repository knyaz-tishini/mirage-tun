[workspace]
resolver = "2"
members = [
    "crates/mirage-ipstack",
    "crates/mirage-wfp",
    "crates/mirage-tun-core",
    "crates/mirage-dns",
    ".",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[package]
name = "mirage2tun"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mirage2tun"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
windows-service = "0.7"
libloading = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Networking_WinSock"] }
socket2 = { version = "0.5", features = ["all"] }
mirage-wfp = { path = "crates/mirage-wfp" }
mirage-tun-core = { path = "crates/mirage-tun-core" }
rand = { version = "0.8", features = ["std", "std_rng"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
mirage-ipstack = { path = "crates/mirage-ipstack" }
mirage-dns = { path = "crates/mirage-dns" }
log = "0.4"

[profile.release]
opt-level = 3
strip = "symbols"
