[workspace]
resolver = "2"
members = [
    "crates/mirage-tun-core",
    "crates/mirage-tun-windows",
    "crates/mirage-tun-windows/crates/mirage-wfp",
    "crates/mirage-tun-windows/crates/mirage-dns",
    "crates/mirage-tcpip-stack",
    "crates/mirage-tun-linux",
    "crates/mirage-tun-macos",
    "crates/mirage-tun-android",
    "crates/mirage-tun-ios",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[patch.crates-io]
smoltcp = { path = "crates/mirage-tun-windows/vendor/smoltcp-0.12.0" }
etherparse = { path = "crates/mirage-tun-windows/vendor/etherparse-0.16.0" }
spin = { path = "crates/mirage-tun-windows/vendor/spin-0.9.8" }
futures = { path = "crates/mirage-tun-windows/vendor/futures-0.3.32" }

[profile.release]
opt-level = 3
strip = "symbols"
