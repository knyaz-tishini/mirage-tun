[package]
name = "mirage-tun-linux"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mirage2tun"
path = "src/bin/mirage2tun.rs"

[dependencies]
mirage-tun-core = { path = "../mirage-tun-core" }
tokio = { version = "1", features = ["net", "io-util", "process", "sync", "rt", "rt-multi-thread", "macros", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
libc = "0.2"
# "all" enables Socket::set_mark (SO_MARK) — used to route the tunnel's own
# outbound legs (SOCKS5 dial, bypass dial) around the policy-routing table
# that sends everything else out via the TUN device.
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
# eBPF loader (userspace, stable Rust). The kernel-side program is plain C
# compiled by build.rs (clang -target bpf), so no aya-ebpf/nightly here.
aya = "0.13"
