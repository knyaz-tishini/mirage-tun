[package]
license = "MIT"
name = "mirage-wfp"
version.workspace = true
edition.workspace = true
description = "Windows Filtering Platform (WFP) safe wrapper"
repository = "https://github.com/knyaz-tishini/mirage2tun"
homepage = "https://github.com/knyaz-tishini/mirage2tun"
[dependencies]
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Rpc",
] }
