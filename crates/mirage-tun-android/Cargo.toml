[package]
license = "MIT"
name = "mirage-tun-android"
version.workspace = true
edition.workspace = true
repository = "https://github.com/knyaz-tishini/mirage-tun"
homepage = "https://github.com/knyaz-tishini/mirage-tun"
[lib]
crate-type = ["lib"]

[dependencies]
mirage-tun-core = { path = "../mirage-tun-core" }
mirage-tcpip-stack = { path = "../mirage-tcpip-stack" }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
