[package]
name = "mirage-tun-macos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mirage2tun"
path = "src/bin/mirage2tun.rs"

[dependencies]
mirage-tun-core = { path = "../mirage-tun-core" }
tokio = { version = "1", features = ["net", "io-util", "process", "sync", "rt", "rt-multi-thread", "macros", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
libc = "0.2"
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
