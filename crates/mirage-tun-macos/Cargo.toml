[package]
name = "mirage-tun-macos"
version = "0.1.0"
edition = "2021"

[dependencies]
mirage-tun-core = { path = "../mirage-tun-core" }
tokio = { version = "1", features = ["net", "io-util", "process", "sync", "rt", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
libc = "0.2"
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
